<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Subtle Document Border -->
  <rect x="96" y="80" width="320" height="352" rx="28" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />
  
  <!-- Invoice Lines -->
  <rect x="144" y="140" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.5" />
  <rect x="144" y="172" width="224" height="10" rx="5" fill="#ffffff" fill-opacity="0.3" />
  
  <!-- Central Glowing Rupee Symbol -->
  <text x="256" y="340" font-family="Inter, -apple-system, sans-serif" font-size="190" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
  
  <!-- Small Star / Shield Accent -->
  <circle cx="370" cy="140" r="14" fill="#38bdf8" />
</svg>
